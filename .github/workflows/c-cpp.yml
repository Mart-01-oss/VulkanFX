name: Build VulkanFX for Android (aarch64)

on:
  push:
    branches: [ VulkanFX ]
  pull_request:
    branches: [ VulkanFX ]

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip ninja-build meson pkg-config cmake git wget unzip glslang-tools

      - name: Download Android NDK r26
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r26d-linux.zip -O ndk.zip
          unzip -q ndk.zip -d /opt/
          mv /opt/android-ndk-r26d /opt/ndk

      - name: Create NDK cross file
        run: |
          mkdir -p .github
          cat <<'EOF' > .github/ndk-aarch64.ini
          [binaries]
          c = '/opt/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang'
          cpp = '/opt/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++'
          ar = '/opt/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip = '/opt/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'

          [paths]
          prefix = '/out'
          libdir = 'lib'
          bindir = 'bin'

          [properties]
          needs_exe_wrapper = true
          c_args = ['-fPIC', '-O2']
          cpp_args = ['-fPIC', '-O2']
          EOF

      - name: Build VulkanFX
        run: |
          mkdir -p build && cd build
          meson setup . ../ --cross-file ../.github/ndk-aarch64.ini --prefix=/out --buildtype=release
          ninja -j$(nproc)

      - name: Collect Artifacts
        run: |
          mkdir -p artifact/lib
          find build -name "*.so" -exec cp {} artifact/lib/ \;

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vulkanfx-android-aarch64
          path: artifact/
