name: VulkanFX (NDK Bionic Build)

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04-arm

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3 python3-pip ninja-build meson pkg-config cmake \
          git wget unzip glslang-tools build-essential libvulkan-dev \
          libdrm-dev libx11-dev libxi-dev libxrandr-dev libxext-dev

    - name: Install LLVM/Clang 20
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 20
        sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-20 100
        sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-20 100
        clang --version

    - name: Install Android NDK Toolchain
      run: |
        wget https://dl.google.com/android/repository/android-ndk-r27b-linux.zip
        unzip android-ndk-r27b-linux.zip -d $HOME
        mv $HOME/android-ndk-r27b $HOME/android-ndk

    - name: Create NDK cross-file
      run: |
        cat > .github/ndk-aarch64.ini <<'EOF'
        [binaries]
        c = '$HOME/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang'
        cpp = '$HOME/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++'
        ar = '$HOME/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
        strip = '$HOME/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
        pkgconfig = '/usr/bin/pkg-config'

        [host_machine]
        system = 'android'
        cpu_family = 'aarch64'
        cpu = 'armv8-a'
        endian = 'little'

        [paths]
        prefix = '/out'
        libdir = 'lib'
        includedir = 'include'
        EOF

    - name: Configure Meson build
      run: |
        mkdir -p build
        cd build
        meson setup . ../ \
          --cross-file ../.github/ndk-aarch64.ini \
          --prefix=/out \
          --buildtype=release \
          --wrap-mode=forcefallback \
          -Dcpp_std=c++20

    - name: Build VulkanFX
      run: |
        cd build
        ninja -j$(nproc)

    - name: Package and upload build
      run: |
        cd build
        tar -cf VulkanFX-build.tar out/
        mv VulkanFX-build.tar $GITHUB_WORKSPACE/

    - name: Upload VulkanFX artifact
      uses: actions/upload-artifact@v4
      with:
        name: VulkanFX-Build
        path: VulkanFX-build.tar
